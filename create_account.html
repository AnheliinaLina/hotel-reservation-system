<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Aurora - Create Account</title>
    <style>
        /* Глобальні налаштування для відповідності Фігмі */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #ffffff; }

        /* Навігація та Лого */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; background-color: #e2eeff; }
        .nav-actions { display: flex; gap: 10px; }
        .nav-actions button { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; color: white; }
        .lang-btn { background: #74abf5; }
        .secondary-btn { background: #8fbdfa; }
        .primary-btn { background: #6da5f3; }
        
        .logo-bar { padding: 20px 40px; }
        .logo-container img { height: 100px; }

        /* Контейнер форми */
        .auth-container { flex: 1; max-width: 450px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        h1 { color: #3b5a84; font-size: 36px; margin-bottom: 30px; font-weight: normal; }
        
        .form-group { margin-bottom: 30px; text-align: left; }
        .form-group h3 { color: #3b5a84; font-size: 18px; margin-bottom: 15px; font-weight: normal; }
        
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: none; border-radius: 8px; background-color: #e2eeff; 
            color: #3b5a84; font-size: 16px; outline: none; 
        }
        input::placeholder { color: #8faecf; }

        /* Terms & Conditions (Блок з Фігми) */
        .terms-block {
            background-color: #e2eeff; padding: 15px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-bottom: 30px; cursor: pointer;
        }
        .terms-block input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: #3b5a84; }
        .terms-block label { color: #3b5a84; font-size: 16px; cursor: pointer; }

        .submit-btn {
            width: 100%; padding: 15px; background-color: #74abf5;
            color: white; border: none; border-radius: 10px;
            font-size: 18px; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background-color: #5a91e0; }

        .copyright-bar { background-color: #8fbdfa; color: #3b5a84; text-align: center; padding: 15px; margin-top: auto; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="contact-info"><span>📞 +48 000 000 000</span></div>
        <div class="nav-actions">
            <button class="lang-btn">🌐 ENG</button>
            <button class="secondary-btn" onclick="location.href='create_account.html'">Create account</button>
            <button class="primary-btn" onclick="location.href='login.html'">Log in ➔</button>
        </div>
    </header>

    <div class="logo-bar">
        <div class="logo-container">
            <a href="index.html"><img src="logo_aurora.jpg" alt="Hotel Aurora Logo"></a>
        </div>
    </div>

    <main class="auth-container">
        <h1>Create Account</h1>
        
        <form id="registerForm">
            <section class="form-group">
                <h3>Personal Info</h3>
                <input type="text" id="reg-name" placeholder="Name" required>
                <input type="text" id="reg-surname" placeholder="Surname" required>
                <input type="text" id="reg-sex" placeholder="Sex">
                <input type="email" id="reg-email" placeholder="E-mail" required>
                <input type="tel" id="reg-phone" value="+48 " maxlength="15">
                <input type="password" id="reg-pass" placeholder="Create password" required>
                <input type="password" id="reg-confirm" placeholder="Confirm password" required>
            </section>

            <section class="form-group">
                <h3>Address</h3>
                <input type="text" id="reg-country" placeholder="Country/Region">
                <input type="text" id="reg-city" placeholder="City">
                <input type="text" id="reg-street" placeholder="Street">
                <input type="text" id="reg-postcode" placeholder="Postcode">
            </section>

            <div class="terms-block" onclick="document.getElementById('terms').click()">
                <input type="checkbox" id="terms" required onclick="event.stopPropagation()">
                <label for="terms">Terms & conditions</label>
            </div>

            <button type="submit" class="submit-btn">Create account</button>
        </form>
    </main>

    <footer class="copyright-bar">
        <p>© 2026 Hotel Aurora. All rights reserved</p>
    </footer>

    <script>
        // 1. МАСКА ТЕЛЕФОНУ (+48 XXX XXX XXX)
        const phoneInput = document.getElementById('reg-phone');
        phoneInput.addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, '').slice(2, 11);
            let res = '+48 ';
            if (v.length > 0) res += v.substring(0, 3);
            if (v.length > 3) res += ' ' + v.substring(3, 6);
            if (v.length > 6) res += ' ' + v.substring(6, 9);
            e.target.value = res;
        });

        // 2. ОБРОБКА РЕЄСТРАЦІЇ
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-confirm').value;

            if(pass !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            // Збираємо дані для localStorage (Ключ 'userProfile' має збігатися з тим, що в профілі)
            const userData = {
                name: document.getElementById('reg-name').value,
                surname: document.getElementById('reg-surname').value,
                sex: document.getElementById('reg-sex').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                country: document.getElementById('reg-country').value,
                city: document.getElementById('reg-city').value,
                street: document.getElementById('reg-street').value,
                postcode: document.getElementById('reg-postcode').value
            };

            // Зберігаємо в LocalStorage
            localStorage.setItem('userProfile', JSON.stringify(userData));
            localStorage.setItem('userPassword', pass); 

            alert('Account created successfully!');
            window.location.href = 'profile.html'; // Відразу ведемо в профіль, щоб побачити результат
        });
    </script>
</body>
</html>
